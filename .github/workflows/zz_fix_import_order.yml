name: Fix import order

on:
  push:
    branches:
      - fix/truth-engine-live-playtest-findings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/truth-engine-live-playtest-findings
          fetch-depth: 0

      - name: Fix import order
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/backend/app/services/base_turn_runner.py")
          text = path.read_text(encoding="utf-8")
          old = '''from app.providers.llm_provider import (
    LLMProvider,
    LLMProviderError,
    LLMProviderTruncatedError,
)
from app.services.role_model_router import ModelRole, RoleModelRouter
from app.services.scene_transition_executor import (
    AppliedSceneTransition,
    SceneTransitionExecutor,
)
from app.services.initial_world_state import InitialWorldStateService
from app.services.turn_planner import (
'''
          new = '''from app.providers.llm_provider import (
    LLMProvider,
    LLMProviderError,
    LLMProviderTruncatedError,
)
from app.services.initial_world_state import InitialWorldStateService
from app.services.role_model_router import ModelRole, RoleModelRouter
from app.services.scene_transition_executor import (
    AppliedSceneTransition,
    SceneTransitionExecutor,
)
from app.services.turn_planner import (
'''
          if old not in text:
              raise SystemExit("Expected import block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/zz_fix_import_order.yml").unlink()

      - name: Verify and commit
        run: |
          cd src/backend
          ruff check --extend-ignore SIM102,BLE001 app/services/base_turn_runner.py || true
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: fix base turn runner import order"
          git push origin HEAD:fix/truth-engine-live-playtest-findings
