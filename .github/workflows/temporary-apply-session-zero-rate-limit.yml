name: Temporary apply session-zero rate-limit fix

on:
  push:
    branches:
      - agent/session-zero-rate-limit-budget
    paths:
      - .github/workflows/temporary-apply-session-zero-rate-limit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-zero-rate-limit-budget

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml

      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n{old[:200]}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          provider = Path("src/backend/app/providers/llm_provider.py")
          replace_once(
              provider,
              '''                except (httpx.RequestError, LLMProviderError, json.JSONDecodeError) as exc:
                    last_error = exc
                    attempt_telemetry.append(
                        {
                            "attempt": attempt,
                            "requested_max_tokens": budget,
                            "status": "error",
                            "error": str(exc),
                        }
                    )
''',
              '''                except (httpx.RequestError, LLMProviderError, json.JSONDecodeError) as exc:
                    last_error = exc
                    attempt_telemetry.append(
                        {
                            "attempt": attempt,
                            "requested_max_tokens": budget,
                            "status": "error",
                            "error": str(exc),
                        }
                    )
                    # A rate limit is not malformed JSON. Retrying immediately with a
                    # larger adaptive budget only consumes more TPM and cannot repair it.
                    if isinstance(exc, LLMProviderError) and (
                        "HTTP 429" in str(exc)
                        or "rate_limit" in str(exc).casefold()
                    ):
                        break
''',
          )

          interview = Path("src/backend/app/services/session_zero_interview.py")
          replace_once(
              interview,
              '''from __future__ import annotations

import json
import re
''',
              '''from __future__ import annotations

import asyncio
import json
import re
''',
          )
          replace_once(
              interview,
              '''    STATE_KEY = "session_zero_interview"
    MAX_HISTORY_MESSAGES = 40
''',
              '''    STATE_KEY = "session_zero_interview"
    MAX_HISTORY_MESSAGES = 6
    MAX_RESPONSE_TOKENS = 1200
    MAX_RATE_LIMIT_WAIT_SECONDS = 8.0
''',
          )
          replace_once(
              interview,
              '''        current = json.dumps(
            state.draft.model_dump(mode="json"),
            ensure_ascii=False,
            indent=2,
        )
''',
              '''        current = json.dumps(
            state.draft.model_dump(mode="json"),
            ensure_ascii=False,
            separators=(",", ":"),
        )
''',
          )
          marker = '''    async def _continue_pending(
        self,
        campaign_id: UUID,
        state: SessionZeroInterviewState,
    ) -> SessionZeroInterviewDecision:
'''
          helper = '''    @classmethod
    def _rate_limit_retry_after(cls, error: Exception) -> float | None:
        text = str(error)
        folded = text.casefold()
        if "429" not in text and "rate_limit" not in folded:
            return None
        match = re.search(
            r"(?:try again in|retry after)\\s*(\\d+(?:\\.\\d+)?)\\s*s",
            text,
            flags=re.IGNORECASE,
        )
        return float(match.group(1)) if match else 1.0

    @classmethod
    def is_rate_limited_error(cls, error: Exception) -> bool:
        return cls._rate_limit_retry_after(error) is not None

    async def _generate_interview_json(self, selection, messages) -> dict:
        async def generate() -> dict:
            return await self._router.generate_json(
                self._provider,
                selection,
                messages,
                max_tokens=self.MAX_RESPONSE_TOKENS,
                temperature=0.25,
                response_model=SessionZeroInterviewDecision,
            )

        try:
            return await generate()
        except LLMProviderError as exc:
            retry_after = self._rate_limit_retry_after(exc)
            if retry_after is None:
                raise
            delay = min(
                max(retry_after, 0.2) + 0.25,
                self.MAX_RATE_LIMIT_WAIT_SECONDS,
            )
            await asyncio.sleep(delay)
            return await generate()

'''
          replace_once(interview, marker, helper + marker)
          replace_once(
              interview,
              '''        data = await self._router.generate_json(
            self._provider,
            selection,
            messages,
            max_tokens=2800,
            temperature=0.25,
            response_model=SessionZeroInterviewDecision,
        )
''',
              '''        data = await self._generate_interview_json(selection, messages)
''',
          )

          cli = Path("src/backend/cli.py")
          replace_once(
