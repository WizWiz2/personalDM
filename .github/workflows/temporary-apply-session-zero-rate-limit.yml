name: Apply session-zero rate-limit fix

on:
  push:
    branches:
      - agent/session-zero-rate-limit-budget
    paths:
      - .github/workflows/temporary-apply-session-zero-rate-limit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-zero-rate-limit-budget

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml

      - name: Apply source changes
        run: python scripts/temporary_apply_session_zero_rate_limit.py

      - name: Install dependencies
        run: python -m pip install -e "src/backend[dev]"

      - name: Run focused tests
        working-directory: src/backend
        run: |
          pytest -q tests/test_session_zero_rate_limit_budget.py tests/test_cli_session_zero_resilience.py --tb=short
          ruff check app/providers/llm_provider.py app/services/session_zero_interview.py cli.py tests/test_session_zero_rate_limit_budget.py tests/test_cli_session_zero_resilience.py

      - name: Commit final change
        run: |
          rm .github/workflows/temporary-apply-session-zero-rate-limit.yml
          rm scripts/temporary_apply_session_zero_rate_limit.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Снизить расход токенов нулевой сессии и переживать 429"
          git push origin HEAD:agent/session-zero-rate-limit-budget
