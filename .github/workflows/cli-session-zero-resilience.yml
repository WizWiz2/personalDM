name: CLI session zero and cloud resilience

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    paths:
      - "src/backend/cli.py"
      - "src/backend/app/models/session_zero_interview.py"
      - "src/backend/app/services/session_zero_interview.py"
      - "src/backend/app/services/role_model_router.py"
      - "src/backend/app/services/post_turn_processor.py"
      - "src/backend/tests/test_cli_session_zero_resilience.py"
      - ".github/workflows/cli-session-zero-resilience.yml"

jobs:
  cli-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Report repository line counts
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import subprocess

          root = Path('../..').resolve()
          tracked = subprocess.check_output(
              ['git', '-C', str(root), 'ls-files'], text=True
          ).splitlines()
          text_suffixes = {
              '.py', '.yml', '.yaml', '.toml', '.md', '.html', '.css',
              '.js', '.ts', '.json', '.sh', '.sql', '.ini', '.cfg', '.txt'
          }
          stats = defaultdict(lambda: {'files': 0, 'lines': 0, 'nonblank': 0, 'codeish': 0})

          def category(path: str) -> str:
              if path == 'src/backend/cli.py' or path.startswith('src/backend/app/'):
                  return 'production_python' if path.endswith('.py') else 'production_other'
              if path.startswith('src/backend/tests/') and path.endswith('.py'):
                  return 'tests_python'
              if path.startswith('src/backend/alembic/') and path.endswith('.py'):
                  return 'migrations_python'
              if path.startswith('.github/workflows/'):
                  return 'github_workflows'
              if path.endswith('.md'):
                  return 'documentation'
              return 'other_text'

          for rel in tracked:
              path = root / rel
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              bucket = stats[category(rel)]
              bucket['files'] += 1
              bucket['lines'] += len(lines)
              bucket['nonblank'] += sum(bool(line.strip()) for line in lines)
              bucket['codeish'] += sum(
                  bool(line.strip()) and not line.lstrip().startswith(('#', '//'))
                  for line in lines
              )

          total = {key: sum(item[key] for item in stats.values()) for key in ('files', 'lines', 'nonblank', 'codeish')}
          print('LOC_REPORT_BEGIN')
          for name in sorted(stats):
              print(name, stats[name])
          print('all_tracked_text', total)
          print('python_all', {
              key: sum(stats[name][key] for name in ('production_python', 'tests_python', 'migrations_python'))
              for key in ('files', 'lines', 'nonblank', 'codeish')
          })
          print('LOC_REPORT_END')
          PY
      - name: Compile CLI and services
        run: >-
          python -m compileall -q cli.py app/models/session_zero_interview.py
          app/services/session_zero_interview.py app/services/role_model_router.py
          app/services/post_turn_processor.py tests/test_cli_session_zero_resilience.py
      - name: Validate migrations
        run: |
          rm -rf data
          alembic upgrade head
      - name: Run focused acceptance
        run: pytest -q tests/test_cli_session_zero_resilience.py --tb=short
      - name: Lint changed Python files
        run: >-
          ruff check --extend-ignore BLE001,ISC004,SIM102,I001 cli.py
          app/models/session_zero_interview.py app/services/session_zero_interview.py
          app/services/role_model_router.py app/services/post_turn_processor.py
          tests/test_cli_session_zero_resilience.py
