name: Memory lifecycle

on:
  push:
    branches:
      - "agent/memory-semantics-lifecycle"
  pull_request:
    paths:
      - "src/backend/app/models/memory_semantics.py"
      - "src/backend/app/models/proposed_change.py"
      - "src/backend/app/db/fact_memory_table.py"
      - "src/backend/app/db/narrative_detail_table.py"
      - "src/backend/app/db/repositories/fact_memory_repo.py"
      - "src/backend/app/db/repositories/narrative_detail_repo.py"
      - "src/backend/app/services/canon_semantics.py"
      - "src/backend/app/services/memory_scribe.py"
      - "src/backend/app/services/post_turn_processor.py"
      - "src/backend/app/services/canon_applier.py"
      - "src/backend/app/services/continuity_checker.py"
      - "src/backend/app/services/scene_context_guard.py"
      - "src/backend/app/services/scene_lifecycle.py"
      - "src/backend/alembic/**"
      - "src/backend/tests/test_memory_lifecycle.py"
      - ".github/workflows/memory-lifecycle-tests.yml"

jobs:
  validate-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml

      - run: python -m pip install -e ".[dev]"

      - name: Compile backend
        run: python -m compileall -q app tests

      - name: Validate migration cycle
        run: |
          rm -rf data
          alembic upgrade head
          alembic downgrade f0a1b2c3d4e5
          alembic upgrade head

      - name: Run memory lifecycle contracts
        run: |
          pytest -q \
            tests/test_memory_lifecycle.py \
            tests/test_canon_semantics.py \
            tests/test_memory_scribe_guard.py \
            tests/test_context.py \
            tests/test_scene_transition_undo.py \
            --tb=short

      - name: Lint changed files
        run: |
          ruff check --extend-ignore BLE001 \
            app/models/memory_semantics.py \
            app/models/proposed_change.py \
            app/db/fact_memory_table.py \
            app/db/narrative_detail_table.py \
            app/db/repositories/fact_memory_repo.py \
            app/db/repositories/narrative_detail_repo.py \
            app/services/canon_semantics.py \
            app/services/memory_scribe.py \
            app/services/post_turn_processor.py \
            app/services/canon_applier.py \
            app/services/continuity_checker.py \
            app/services/scene_context_guard.py \
            app/services/scene_lifecycle.py \
            tests/test_memory_lifecycle.py
