name: Frontend build

on:
  push:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
