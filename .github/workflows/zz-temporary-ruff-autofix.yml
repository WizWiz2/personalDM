name: Temporary Ruff autofix

on:
  push:
    branches:
      - feat/truth-engine-2-foundation
    paths:
      - ".github/workflows/zz-temporary-ruff-autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/truth-engine-2-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.7

      - name: Apply targeted Ruff fixes
        working-directory: src/backend
        run: |
          ruff check --fix --unsafe-fixes \
            app/runtime.py \
            app/services/location_profile_guard.py \
            app/services/turn_authority_planner.py \
            app/services/playable_bootstrap.py \
            live_model_contracts/runner.py \
            live_model_contracts/transition_cases.py \
            tests/test_runtime_parity.py \
            tests/test_interagent_turn_authority.py \
            tests/test_post_turn_npc_pipeline.py || true
          python - <<'PY'
          from pathlib import Path

          planner = Path("app/services/turn_authority_planner.py")
          text = planner.read_text(encoding="utf-8")
          old = """        offset = 0\n        for item in accepted:\n            index = item.insert_at + offset\n            patched.action_sequence.steps.insert(index, item.step)\n            offset += 1\n"""
          new = """        for offset, item in enumerate(accepted):\n            index = item.insert_at + offset\n            patched.action_sequence.steps.insert(index, item.step)\n"""
          if old not in text:
              raise SystemExit("planner offset loop shape changed")
          planner.write_text(text.replace(old, new, 1), encoding="utf-8")

          bootstrap = Path("app/services/playable_bootstrap.py")
          text = bootstrap.read_text(encoding="utf-8")
          old = """        if not isinstance(raw_npcs, list):\n            raise ValueError(\"Structured starter NPC contract is malformed\")\n"""
          new = """        if not isinstance(raw_npcs, list):\n            raise TypeError(\"Structured starter NPC contract is malformed\")\n"""
          if old not in text:
              raise SystemExit("starter NPC type guard shape changed")
          bootstrap.write_text(text.replace(old, new, 1), encoding="utf-8")

          interagent = Path("tests/test_interagent_turn_authority.py")
          text = interagent.read_text(encoding="utf-8")
          text = text.replace("from datetime import datetime", "from datetime import UTC, datetime", 1)
          text = text.replace("datetime.utcnow()", "datetime.now(UTC)")
          old = '    assert plan.npc_introductions[0].canonical_name == "Дежурный фабрики"\n'
          new = (
              '    assert plan.npc_introductions[0].canonical_name == "Ночной дежурный"\n'
              '    assert plan.npc_introductions[0].temporary_name is True\n'
          )
          if old not in text:
              raise SystemExit("interagent planner identity assertion shape changed")
          interagent.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff check --fix --unsafe-fixes \
            app/runtime.py \
            app/services/location_profile_guard.py \
            app/services/turn_authority_planner.py \
            app/services/playable_bootstrap.py \
            live_model_contracts/runner.py \
            live_model_contracts/transition_cases.py \
            tests/test_runtime_parity.py \
            tests/test_interagent_turn_authority.py \
            tests/test_post_turn_npc_pipeline.py
          ruff check \
            app/runtime.py \
            app/services/location_profile_guard.py \
            app/services/turn_authority_planner.py \
            app/services/playable_bootstrap.py \
            live_model_contracts/runner.py \
            live_model_contracts/transition_cases.py \
            tests/test_runtime_parity.py \
            tests/test_interagent_turn_authority.py \
            tests/test_post_turn_npc_pipeline.py
          git diff --check

      - name: Commit exact lint fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/app/runtime.py \
            src/backend/app/services/location_profile_guard.py \
            src/backend/app/services/turn_authority_planner.py \
            src/backend/app/services/playable_bootstrap.py \
            src/backend/live_model_contracts/runner.py \
            src/backend/live_model_contracts/transition_cases.py \
            src/backend/tests/test_runtime_parity.py \
            src/backend/tests/test_interagent_turn_authority.py \
            src/backend/tests/test_post_turn_npc_pipeline.py
          git commit -m "Apply targeted Ruff fixes"
          git push origin HEAD:feat/truth-engine-2-foundation
