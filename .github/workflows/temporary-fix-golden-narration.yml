name: Temporary fix golden narration fixture

on:
  push:
    branches:
      - agent/explicit-narration-pipeline
    paths:
      - .github/workflows/temporary-fix-golden-narration.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/explicit-narration-pipeline
      - name: Update golden fixture to explicit raw stream seam
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/backend/tests/test_golden_playthrough.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'async def _intro_narrator(_provider, messages, *args, **kwargs):':
                  'async def _intro_narrator(messages, *args, **kwargs):',
              'async def _sequence_narrator(_provider, messages, *args, **kwargs):':
                  'async def _sequence_narrator(messages, *args, **kwargs):',
              'app.services.narration_pipeline.NarrationPipelineProvider._collect_raw':
                  'app.services.narration_pipeline.NarrationPipelineProvider._raw_stream',
          }
          expected = {
              'async def _intro_narrator(_provider, messages, *args, **kwargs):': 1,
              'async def _sequence_narrator(_provider, messages, *args, **kwargs):': 1,
              'app.services.narration_pipeline.NarrationPipelineProvider._collect_raw': 2,
          }
          for old, count in expected.items():
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{old!r}: expected {count}, found {actual}')
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/temporary-fix-golden-narration.yml
      - name: Commit fixture migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Перевести golden playthrough на явный narration seam'
          git push origin HEAD:agent/explicit-narration-pipeline
