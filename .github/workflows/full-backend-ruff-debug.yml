name: Clean diff Ruff debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  ruff:
    if: github.head_ref == 'agent/generative-simulation-overhaul-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generative-simulation-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e 'src/backend[dev]'
      - name: Run Ruff on changed Python files
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.py')
          printf '%s\n' "${files[@]}" > changed-python-files.log
          if ((${#files[@]})); then
            ruff check "${files[@]}" > clean-diff-ruff.log 2>&1
          else
            echo 'No changed Python files' > clean-diff-ruff.log
          fi
      - name: Publish Ruff log
        if: always()
        run: |
          {
            echo 'FILES:'
            cat changed-python-files.log
            echo
            echo 'RUFF:'
            cat clean-diff-ruff.log
            echo
            echo "ruff_outcome=${{ steps.ruff.outcome }}"
          } > clean-diff-ruff-report.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -f -B agent/generative-simulation-overhaul-ruff-debug
          git add -f clean-diff-ruff-report.log
          git commit -m "Сохранить Ruff clean diff log"
          git push --force origin HEAD:agent/generative-simulation-overhaul-ruff-debug
      - name: Fail when Ruff fails
        if: steps.ruff.outcome == 'failure'
        run: exit 1
