name: Clarify narrator routing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/clarify-narrator-model-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-narrator-model-routing
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make narrator routing explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          turn_runner = Path("src/backend/app/services/turn_runner.py")
          text = turn_runner.read_text(encoding="utf-8")
          text = text.replace(
              "from app.providers.llm_provider import (\n"
              "    LLMProvider,\n"
              "    LLMProviderError,\n"
              "    LLMProviderTruncatedError,\n"
              ")\n",
              "from app.providers.llm_provider import (\n"
              "    LLMProvider,\n"
              "    LLMProviderError,\n"
              "    LLMProviderTruncatedError,\n"
              ")\n"
              "from app.services.role_model_router import ModelRole, RoleModelRouter\n",
          )
          marker = "    async def _fail_user_turn(self, user_turn_id: UUID, owned: bool) -> None:\n"
          helper = '''    def _annotate_model_role(self, selection) -> None:\n        telemetry = dict(self._llm_provider.last_telemetry or {})\n        telemetry.update(\n            {\n                "model_role": selection.role.value,\n                "role_model_source": selection.source,\n                "role_router_fallback": False,\n                "resolved_model": selection.config.model_name,\n            }\n        )\n        self._llm_provider.last_telemetry = telemetry\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker)

          old_config = '''        config = await self._config_repo.get_by_campaign_id(campaign_id)\n        if not config:\n            await self._generation_runs.set_status(\n                generation_run.id,\n                "failed",\n                error="No LLM provider is configured for this campaign",\n            )\n            await self._fail_user_turn(user_turn.id, owns_user_turn)\n            yield "[Generation failed: no LLM provider is configured for this campaign.]"\n            return\n        api_key = await self._config_repo.get_decrypted_key(campaign_id)\n'''
          new_config = '''        primary_config = await self._config_repo.get_by_campaign_id(campaign_id)\n        if not primary_config:\n            await self._generation_runs.set_status(\n                generation_run.id,\n                "failed",\n                error="No LLM provider is configured for this campaign",\n            )\n            await self._fail_user_turn(user_turn.id, owns_user_turn)\n            yield "[Generation failed: no LLM provider is configured for this campaign.]"\n            return\n        narrator_selection = await RoleModelRouter(self._config_repo).resolve(\n            campaign_id,\n            ModelRole.NARRATOR,\n            primary_config,\n        )\n        if narrator_selection is None:\n            await self._generation_runs.set_status(\n                generation_run.id,\n                "failed",\n                error="Narrator model routing did not return a provider",\n            )\n            await self._fail_user_turn(user_turn.id, owns_user_turn)\n            yield "[Generation failed: narrator model routing is unavailable.]"\n            return\n        config = narrator_selection.config\n        api_key = narrator_selection.api_key\n'''
          if old_config not in text:
              raise SystemExit("TurnRunner provider block not found")
          text = text.replace(old_config, new_config)
          append = "                    attempt_telemetry.append(dict(self._llm_provider.last_telemetry or {}))"
          replacement = (
              "                    self._annotate_model_role(narrator_selection)\n"
              "                    attempt_telemetry.append(dict(self._llm_provider.last_telemetry or {}))"
          )
          count = text.count(append)
          if count != 3:
              raise SystemExit(f"Expected 3 telemetry append sites, found {count}")
          text = text.replace(append, replacement)
          turn_runner.write_text(text, encoding="utf-8")

          simulation = Path("src/backend/tests/run_realistic_simulation_v2.py")
          text = simulation.read_text(encoding="utf-8")
          old_selections = '''        builder_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.CHARACTER_BUILDER,\n            config,\n        )\n        evaluator_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.EVALUATOR,\n            config,\n        )\n        player_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.PLAYER,\n            config,\n        )\n        scenario_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.SCENARIO_BUILDER,\n            config,\n        )\n        if any(\n            selection is None\n            for selection in (\n                builder_selection,\n                evaluator_selection,\n                player_selection,\n                scenario_selection,\n            )\n        ):\n'''
          new_selections = '''        narrator_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.NARRATOR,\n            config,\n        )\n        builder_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.CHARACTER_BUILDER,\n            config,\n        )\n        scribe_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.SCRIBE,\n            config,\n        )\n        curator_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.CURATOR,\n            config,\n        )\n        evaluator_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.EVALUATOR,\n            config,\n        )\n        player_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.PLAYER,\n            config,\n        )\n        scenario_selection = await role_router.resolve(\n            campaign_id,\n            ModelRole.SCENARIO_BUILDER,\n            config,\n        )\n        if any(\n            selection is None\n            for selection in (\n                narrator_selection,\n                builder_selection,\n                scribe_selection,\n                curator_selection,\n                evaluator_selection,\n                player_selection,\n                scenario_selection,\n            )\n        ):\n'''
          if old_selections not in text:
              raise SystemExit("Simulation role selection block not found")
          text = text.replace(old_selections, new_selections)

          old_counts = '''        logical_records = list(trace.records.values())\n        generation_failures = sum(bool(item.get("generation_failed")) for item in logical_records)\n'''
          new_counts = '''        logical_records = list(trace.records.values())\n        generation_failures = sum(bool(item.get("generation_failed")) for item in logical_records)\n        assistant_model_counts = Counter(\n            str(turn.model_name or "unknown")\n            for turn in all_turns\n            if turn.role == "assistant" and turn.status == "active"\n        )\n        model_routing = {\n            "Narrator (DM prose)": narrator_selection,\n            "Character Builder": builder_selection,\n            "Memory Scribe": scribe_selection,\n            "Thesis Curator": curator_selection,\n            "Evaluator": evaluator_selection,\n            "Player Simulator": player_selection,\n            "Scenario Builder": scenario_selection,\n        }\n'''
          if old_counts not in text:
              raise SystemExit("Simulation count block not found")
          text = text.replace(old_counts, new_counts)

          old_report = '''            f"- Generated scenario: `{json.dumps(catalog_summary(catalog), ensure_ascii=False)}`",\n            f"- Кампания: {campaign.name}",\n'''
          new_report = '''            f"- Generated scenario: `{json.dumps(catalog_summary(catalog), ensure_ascii=False)}`",\n            "",\n            "## Маршрутизация моделей",\n            *(\n                f"- {label}: `{selection.config.model_name}` ({selection.source})"\n                for label, selection in model_routing.items()\n            ),\n            "- Фактические модели сохранённых ответов ДМа: "\n            + ", ".join(\n                f"`{model}` — {count}"\n                for model, count in sorted(assistant_model_counts.items())\n            ),\n            "",\n            f"- Кампания: {campaign.name}",\n'''
          if old_report not in text:
              raise SystemExit("Simulation report insertion point not found")
          text = text.replace(old_report, new_report)
          simulation.write_text(text, encoding="utf-8")

          tests = Path("src/backend/tests/test_turns.py")
          text = tests.read_text(encoding="utf-8")
          old_assertions = '''    assert history[1]["role"] == "assistant"\n    assert history[1]["parent_turn_id"] == history[0]["id"]\n'''
          new_assertions = '''    assert history[1]["role"] == "assistant"\n    assert history[1]["parent_turn_id"] == history[0]["id"]\n    provider = client.get(f"/api/campaigns/{campaign_id}/provider").json()\n    assert history[1]["model_name"] == provider["model_name"]\n'''
          if old_assertions not in text:
              raise SystemExit("Turn flow assertions not found")
          text = text.replace(old_assertions, new_assertions)
          tests.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/clarify-narrator-routing.yml

      - name: Install backend
        run: python -m pip install -e 'src/backend[dev]'

      - name: Compile
        run: python -m compileall -q src/backend/app src/backend/tests

      - name: Run focused tests
        working-directory: src/backend
        run: pytest -q tests/test_role_model_router.py tests/test_turns.py --tb=short

      - name: Run full backend tests
        working-directory: src/backend
        run: pytest -q --tb=short

      - name: Lint changed Python files
        run: |
          mapfile -t files < <(git diff --name-only main...HEAD -- '*.py'; git diff --name-only -- '*.py')
          mapfile -t unique < <(printf '%s\n' "${files[@]}" | sort -u | sed '/^$/d')
          if [ "${#unique[@]}" -gt 0 ]; then
            ruff check "${unique[@]}"
          fi

      - name: Publish patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Явно маркировать модель Narrator"
          git push origin HEAD:agent/clarify-narrator-model-routing
