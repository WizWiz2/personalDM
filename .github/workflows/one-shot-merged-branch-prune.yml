name: One-shot cleanup of verified merged branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-merged-branch-prune.yml

permissions:
  contents: write

jobs:
  prune:
    if: contains(github.event.head_commit.message, '[prune-merged-branches]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete only untouched heads of already merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{repo}"

          def api(path, method="GET"):
              req = urllib.request.Request(
                  root + path,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "personalDM-merged-branch-cleanup",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if method == "DELETE":
                      return None
                  return json.load(response)

          def pages(endpoint):
              rows = []
              page = 1
              while True:
                  chunk = api(f"{endpoint}&page={page}")
                  rows.extend(chunk)
                  if len(chunk) < 100:
                      return rows
                  page += 1

          # A merged PR with the SAME head SHA proves no new unreviewed
          # commits were added to the branch since that merge.
          merged_heads = {
              (pr["head"]["ref"], pr["head"]["sha"])
              for pr in pages("/pulls?state=closed&per_page=100")
              if pr.get("merged_at") and pr.get("head")
          }
          branches = pages("/branches?per_page=100")
          deleted = []
          skipped = []
          for branch in branches:
              name = branch["name"]
              sha = branch["commit"]["sha"]
              if name == "main" or branch.get("protected"):
                  skipped.append((name, "main/protected"))
                  continue
              if (name, sha) not in merged_heads:
                  skipped.append((name, "not an exact merged PR head"))
                  continue

              escaped = urllib.parse.quote(name, safe="")
              fresh = api(f"/branches/{escaped}")
              if fresh["commit"]["sha"] != sha or fresh.get("protected"):
                  skipped.append((name, "SHA changed or protected"))
                  continue
              api(f"/git/refs/heads/{urllib.parse.quote(name, safe='/')}", "DELETE")
              deleted.append(name)
              print(f"Deleted: {name} at {sha[:12]}", flush=True)

          print(json.dumps({
              "deleted_count": len(deleted),
              "skipped_count": len(skipped),
              "deleted": deleted,
              "skipped": skipped,
          }, ensure_ascii=False, indent=2))
          PY
