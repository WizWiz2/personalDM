name: Cleanup campaign hardcode

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/remove-campaign-hardcode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-campaign-hardcode
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revert overfitted campaign layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-commit 49a6f1db61f48fb697b8c45b2568feadf4034397
          git checkout 49a6f1db61f48fb697b8c45b2568feadf4034397 -- \
            src/backend/app/config.py \
            src/backend/app/providers/llm_provider.py \
            src/backend/app/services/memory_scribe.py \
            src/backend/app/services/turn_runner.py \
            src/backend/tests/simulation_database.py \
            src/backend/tests/test_llm_provider_resilience.py
          rm -f .github/workflows/cleanup-campaign-hardcode.yml
          git add -A
          git status --short

      - name: Install backend
        run: python -m pip install -e 'src/backend[dev]'

      - name: Compile backend
        run: python -m compileall -q src/backend/app src/backend/tests

      - name: Run backend tests
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q src/backend/tests 2>&1 | tee pytest-cleanup.log

      - name: Publish pytest diagnostics
        if: steps.pytest.outcome == 'failure'
        run: |
          git checkout -f -B agent/remove-campaign-hardcode-debug
          git add -f pytest-cleanup.log
          git commit -m "Сохранить pytest cleanup log"
          git push --force origin HEAD:agent/remove-campaign-hardcode-debug

      - name: Fail after pytest diagnostics
        if: steps.pytest.outcome == 'failure'
        run: exit 1

      - name: Autofix Ruff
        run: |
          ruff check --fix src/backend || true
          git add -A

      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check src/backend 2>&1 | tee ruff-cleanup.log

      - name: Publish Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: |
          git checkout -f -B agent/remove-campaign-hardcode-debug
          git add -f ruff-cleanup.log
          git commit -m "Сохранить Ruff cleanup log"
          git push --force origin HEAD:agent/remove-campaign-hardcode-debug

      - name: Fail after Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: exit 1

      - name: Publish cleanup commit
        run: |
          git commit -m "Удалить кампанийный хардкод из симуляции"
          git push origin HEAD:agent/remove-campaign-hardcode
