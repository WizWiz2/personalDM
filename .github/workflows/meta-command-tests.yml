name: Meta command routing

on:
  push:
    branches:
      - "agent/meta-command-router"
  pull_request:
    paths:
      - "src/backend/app/api/turns.py"
      - "src/backend/app/models/turn.py"
      - "src/backend/app/db/repositories/turn_repo.py"
      - "src/backend/app/services/meta_command_router.py"
      - "src/backend/app/services/role_model_router.py"
      - "src/backend/tests/test_meta_commands.py"
      - ".github/workflows/meta-command-tests.yml"

jobs:
  meta-command-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: python -m pip install -e "src/backend[dev]"
      - name: Compile backend
        run: python -m compileall -q src/backend/app src/backend/tests
      - name: Run meta-command contracts
        working-directory: src/backend
        run: pytest -q tests/test_meta_commands.py tests/test_turns.py --tb=short
      - name: Lint meta-command files
        working-directory: src/backend
        run: >-
          ruff check --ignore B008,I001
          app/api/turns.py
          app/models/turn.py
          app/db/repositories/turn_repo.py
          app/services/meta_command_router.py
          app/services/role_model_router.py
          tests/test_meta_commands.py
