name: Memory operations and thesis lifecycle

on:
  push:
    branches:
      - "agent/memory-ops-debugger"
  pull_request:
    paths:
      - "src/backend/app/api/debugger.py"
      - "src/backend/app/db/thesis_lifecycle_table.py"
      - "src/backend/app/models/memory_ops.py"
      - "src/backend/app/services/memory_operations.py"
      - "src/backend/app/services/thesis_curator.py"
      - "src/backend/app/static/memory_ops.html"
      - "src/backend/app/main.py"
      - "src/backend/alembic/**"
      - "src/backend/tests/test_memory_operations.py"
      - "src/backend/tests/test_thesis_curator_lifecycle.py"
      - "src/backend/tests/test_generative_simulation_overhaul.py"
      - ".github/workflows/memory-operations-tests.yml"

jobs:
  memory-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Validate migration cycle
        run: |
          rm -rf data
          alembic upgrade head
          alembic downgrade a1b2c3d4e5f6
          alembic upgrade head
      - name: Run memory operations contracts
        run: |
          pytest -q \
            tests/test_memory_operations.py \
            tests/test_memory_taxonomy.py \
            tests/test_thesis_curator.py \
            tests/test_thesis_curator_lifecycle.py \
            tests/test_generative_simulation_overhaul.py \
            --tb=short
      - name: Lint changed files
        run: |
          ruff check --extend-ignore B008,BLE001,DTZ003,I001 \
            app/api/debugger.py \
            app/db/thesis_lifecycle_table.py \
            app/models/memory_ops.py \
            app/services/memory_operations.py \
            app/services/thesis_curator.py \
            app/main.py \
            tests/test_memory_operations.py \
            tests/test_thesis_curator_lifecycle.py
