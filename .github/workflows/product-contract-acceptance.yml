name: Product contract acceptance

on:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
    paths:
      - "src/backend/app/**"
      - "src/backend/tests/**"
      - ".github/workflows/product-contract-acceptance.yml"
  pull_request:
    paths:
      - "src/backend/app/**"
      - "src/backend/tests/**"
      - ".github/workflows/product-contract-acceptance.yml"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e "src/backend[dev]"

      - name: Compile product-contract paths
        run: >-
          python -m compileall -q
          src/backend/app
          src/backend/tests/test_product_contract_acceptance.py
          src/backend/tests/test_golden_playthrough.py
          src/backend/tests/test_round42_live_playtest_materialization.py
          src/backend/tests/test_round43_scene_memory_integration.py
          src/backend/tests/test_round43_planner_compound_acceptance.py
          src/backend/tests/test_round43_session_zero_placeholder.py
          src/backend/tests/test_round44_memory_attribution_and_plot_facts.py
          src/backend/tests/test_stabilization_location_presence_identity.py
          src/backend/tests/test_turn_undo_authority.py

      - name: Validate migration chain
        working-directory: src/backend
        run: |
          rm -rf data
          alembic upgrade head

      - name: Run player-visible product contracts
        working-directory: src/backend
        run: >-
          pytest -q
          tests/test_product_contract_acceptance.py
          tests/test_golden_playthrough.py
          tests/test_round42_live_playtest_materialization.py
          tests/test_round43_scene_memory_integration.py
          tests/test_round43_planner_compound_acceptance.py
          tests/test_round43_session_zero_placeholder.py
          tests/test_round44_memory_attribution_and_plot_facts.py
          tests/test_stabilization_location_presence_identity.py
          tests/test_turn_undo_authority.py
          --tb=short

      - name: Lint acceptance boundary
        working-directory: src/backend
        run: >-
          ruff check
          tests/test_product_contract_acceptance.py
          app/services/dead_turn_guard.py
          app/services/location_profile_guard.py
          app/services/narration_publication_guard.py
