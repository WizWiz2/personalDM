name: Apply verified live-playtest follow-up patch

on:
  push:
    branches:
      - fix/truth-engine-live-playtest-findings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/truth-engine-live-playtest-findings
          fetch-depth: 0

      - name: Apply verified fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected patch context not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          planner = "src/backend/app/services/turn_authority_planner.py"
          preflight = '''            # A model may treat a person mentioned in historical prose as already known and
            # return `pass` before the regular reviewer notices the allowlist conflict. Run the
            # compact semantic contact check before that verdict; `no_contact` is a no-op.
            if not plan.npc_introductions:
                preflight_contact = await self._apply_npc_contact_recovery(
                    selection,
                    player_input,
                    present_names,
                    plan,
                    ["Проверка физического ответа неизвестного персонажа перед обычным review."],
                )
                if preflight_contact is not None:
                    plan = preflight_contact
                    self._sanitize_npc_names(plan, player_input)

'''
          replace_once(planner, preflight, "")

          replace_once(
              "src/backend/tests/test_generative_simulation_overhaul.py",
              '    assert revision == "c3d4e5f6a7b8"\n',
              '    assert revision == "f6a7b8c9d0e1"\n',
          )
          replace_once(
              "src/backend/tests/test_legacy_migration_drift_chain.py",
              '    assert revision == ("c3d4e5f6a7b8",)\n',
              '    assert revision == ("f6a7b8c9d0e1",)\n',
          )

          base_runner = "src/backend/app/services/base_turn_runner.py"
          replace_once(
              base_runner,
              "from app.services.role_model_router import ModelRole, RoleModelRouter\n",
              "from app.services.initial_world_state import InitialWorldStateService\n"
              "from app.services.role_model_router import ModelRole, RoleModelRouter\n",
          )
          replace_once(
              base_runner,
              "from app.services.initial_world_state import InitialWorldStateService\n"
              "from app.services.turn_planner import (\n",
              "from app.services.turn_planner import (\n",
          )

          Path(".github/workflows/zz_apply_live_playtest_patch.yml").unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: remove redundant NPC preflight and refresh contracts"
          git push origin HEAD:fix/truth-engine-live-playtest-findings
