name: Temporary ClassVar cleanup

on:
  push:
    branches:
      - fix/session-zero-conversation-stalls
    paths:
      - .github/workflows/temporary-classvar-session-zero.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-zero-conversation-stalls
      - name: Annotate immutable service constants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/backend/app/services/session_zero_interview.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from uuid import UUID\n': 'from typing import ClassVar\nfrom uuid import UUID\n',
              '    NO_PREFERENCE_ANSWERS = {\n': '    NO_PREFERENCE_ANSWERS: ClassVar[set[str]] = {\n',
              '    DELEGATABLE_FIELDS = {\n': '    DELEGATABLE_FIELDS: ClassVar[set[str]] = {\n',
              '    START_FIELDS = {\n': '    START_FIELDS: ClassVar[set[str]] = {\n',
              '    TOPIC_KEYWORDS = {\n': (
                  '    TOPIC_KEYWORDS: ClassVar[dict[str, tuple[str, ...]]] = {\n'
              ),
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{old!r}: expected once, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/temporary-classvar-session-zero.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Типизировать константы разговорной нулевой сессии'
          git push origin HEAD:fix/session-zero-conversation-stalls
