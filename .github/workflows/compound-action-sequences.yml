name: Compound action sequences

on:
  push:
    branches:
      - "agent/compound-action-execution"
  pull_request:
    paths:
      - "src/backend/app/db/action_sequence_table.py"
      - "src/backend/app/models/action_sequence.py"
      - "src/backend/app/services/action_sequence_context.py"
      - "src/backend/app/services/action_sequence_executor.py"
      - "src/backend/app/services/scene_transition_executor.py"
      - "src/backend/app/services/turn_planner.py"
      - "src/backend/app/services/turn_undo_service.py"
      - "src/backend/alembic/versions/d8e9f0a1b2c3_add_compound_action_sequences.py"
      - "src/backend/tests/test_compound_action_sequence.py"
      - ".github/workflows/compound-action-sequences.yml"

jobs:
  compound-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: python -m pip install -e "src/backend[dev]"
      - name: Compile backend
        run: python -m compileall -q src/backend/app src/backend/tests
      - name: Validate migration cycle
        working-directory: src/backend
        run: |
          rm -rf data
          alembic upgrade head
          alembic downgrade c7d8e9f0a1b2
          alembic upgrade head
      - name: Run compound action contracts
        working-directory: src/backend
        run: >-
          pytest -q
          tests/test_compound_action_sequence.py
          tests/test_turn_planner.py
          tests/test_scene_transition_executor.py
          tests/test_scene_transition_undo.py
          tests/test_turns.py
          --tb=short
      - name: Lint compound action files
        working-directory: src/backend
        run: >-
          ruff check --ignore B008,I001,DTZ003,SIM102,F401,F841,ISC004
          app/db/action_sequence_table.py
          app/models/action_sequence.py
          app/services/action_sequence_context.py
          app/services/action_sequence_executor.py
          app/services/scene_transition_executor.py
          app/services/turn_planner.py
          app/services/turn_undo_service.py
          tests/test_compound_action_sequence.py
