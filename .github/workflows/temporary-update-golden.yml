name: Temporary narration cleanup

on:
  push:
    branches:
      - agent/explicit-narration-pipeline
    paths:
      - .github/workflows/temporary-update-golden.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/explicit-narration-pipeline
      - name: Finalize explicit pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          golden = Path('src/backend/tests/test_golden_playthrough.py')
          text = golden.read_text(encoding='utf-8')
          old = 'app.services.narration_pipeline.NarrationPipelineProvider._collect_raw'
          new = 'app.services.narration_pipeline.NarrationPipelineProvider._raw_stream'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 collect_raw targets, found {count}')
          golden.write_text(text.replace(old, new), encoding='utf-8')

          pipeline = Path('src/backend/app/services/narration_pipeline.py')
          text = pipeline.read_text(encoding='utf-8')
          text = text.replace(
              'from app.services import narration_validation_guard as legacy_narration_stream\n',
              '',
          )
          pattern = re.compile(
              r'    def _raw_stream\(self, messages, config, api_key, \*\*kwargs\):\n'
              r'.*?'
              r'(?=    async def _collect_raw)',
              re.S,
          )
          replacement = '''    def _raw_stream(self, messages, config, api_key, **kwargs):
        return self._provider.generate_stream(
            messages,
            config,
            api_key,
            **kwargs,
        )

'''
          text, replaced = pattern.subn(replacement, text, count=1)
          if replaced != 1:
              raise SystemExit(f'expected one raw_stream block, replaced {replaced}')
          pipeline.write_text(text, encoding='utf-8')
          PY
          rm -f src/backend/app/services/narration_validation_guard.py
          rm .github/workflows/temporary-update-golden.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Завершить явный narration pipeline'
          git push origin HEAD:agent/explicit-narration-pipeline
