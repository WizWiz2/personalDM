name: Temporary narration cleanup

on:
  push:
    branches:
      - agent/explicit-narration-pipeline
    paths:
      - .github/workflows/temporary-update-golden.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/explicit-narration-pipeline
      - name: Remove compatibility seam
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/backend/app/services/narration_pipeline.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from app.services import narration_validation_guard as legacy_narration_stream\n',
              '',
          )
          old = '''    def _raw_stream(self, messages, config, api_key, **kwargs):
        compatibility_override = legacy_narration_stream._ORIGINAL_GENERATE_STREAM
        if (
            compatibility_override
            is legacy_narration_stream._DEFAULT_GENERATE_STREAM
        ):
            return self._provider.generate_stream(
                messages,
                config,
                api_key,
                **kwargs,
            )
        return compatibility_override(
            self._provider,
            messages,
            config,
            api_key,
            **kwargs,
        )
'''
          new = '''    def _raw_stream(self, messages, config, api_key, **kwargs):
        return self._provider.generate_stream(
            messages,
            config,
            api_key,
            **kwargs,
        )
'''
          if old not in text:
              raise SystemExit('compatibility block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm src/backend/app/services/narration_validation_guard.py
          rm .github/workflows/temporary-update-golden.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Удалить временный narration compatibility seam'
          git push origin HEAD:agent/explicit-narration-pipeline
