name: Dist snapshot

# Rolling player zip on main (and manual). Does NOT create a versioned release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "play.bat"
      - "uninstall.bat"
      - "uninstall.ps1"
      - "scripts/build-dist.ps1"
      - ".github/workflows/dist-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: dist-snapshot
  cancel-in-progress: true

jobs:
  build-snapshot:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build distribution zip
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          ./scripts/build-dist.ps1 -Version "snapshot-$sha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: personaldm-snapshot
          path: dist/PersonalDM-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub prerelease (tag snapshot)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Snapshot (rolling)
          prerelease: true
          make_latest: false
          files: dist/PersonalDM-*.zip
          body: |
            Rolling development snapshot from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Not a stable release. For a versioned build use a `v*` tag (workflow Dist release).

            Zip excludes tools/, models, venv, tests, secrets, and runtime data.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
