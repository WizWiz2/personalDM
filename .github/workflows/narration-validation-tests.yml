name: Narration validation gate

on:
  pull_request:
    paths:
      - "src/backend/app/config.py"
      - "src/backend/app/main.py"
      - "src/backend/app/db/narration_validation_table.py"
      - "src/backend/app/models/narration_validation.py"
      - "src/backend/app/services/narration_validator.py"
      - "src/backend/app/services/narration_pipeline.py"
      - "src/backend/app/services/turn_runner.py"
      - "src/backend/app/services/base_turn_runner.py"
      - "src/backend/app/services/role_model_router.py"
      - "src/backend/alembic/**"
      - "src/backend/tests/test_narration_validation.py"
      - ".github/workflows/narration-validation-tests.yml"
  workflow_dispatch:

jobs:
  validate-narration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Validate migration cycle
        run: |
          rm -rf data
          alembic upgrade head
          alembic downgrade e9f0a1b2c3d4
          alembic upgrade head
      - name: Run narration validation contracts
        run: pytest -q tests/test_narration_validation.py tests/test_turn_planner.py tests/test_turns.py --tb=short
      - name: Lint changed files
        run: >-
          ruff check
          app/config.py
          app/main.py
          app/db/narration_validation_table.py
          app/models/narration_validation.py
          app/services/narration_validator.py
          app/services/narration_pipeline.py
          app/services/turn_runner.py
          app/services/base_turn_runner.py
          app/services/role_model_router.py
          tests/test_narration_validation.py
